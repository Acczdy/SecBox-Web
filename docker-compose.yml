# SecBox-Web - Docker Compose 编排
# 首次启动前：复制 .env.example 为 .env，并填写所需配置。
# 设置位置：项目根目录 .env
# 启动：docker compose up -d --build && docker compose logs security-tools

services:
  security-tools:
    build: .
    image: secbox-web:latest
    container_name: security-tools
    restart: unless-stopped

    ports:
      - "5001:5001"      # Web 服务；公网部署请置于 HTTPS 反向代理之后
      - "${OOB_RMI_PORT:?请在项目根目录 .env 设置 OOB_RMI_PORT}:${OOB_RMI_PORT:?请在项目根目录 .env 设置 OOB_RMI_PORT}"       # RMI 回调
      - "${OOB_LDAP_PORT:?请在项目根目录 .env 设置 OOB_LDAP_PORT}:${OOB_LDAP_PORT:?请在项目根目录 .env 设置 OOB_LDAP_PORT}"     # LDAP 回调
      - "${OOB_HTTP_CALLBACK_PORT:?请在项目根目录 .env 设置 OOB_HTTP_CALLBACK_PORT}:${OOB_HTTP_CALLBACK_PORT:?请在项目根目录 .env 设置 OOB_HTTP_CALLBACK_PORT}" # HTTP 回调

    environment:
      PORT: "5001"
      APP_STATE_DIR: "/app/runtime"
      OOB_HOST: "${OOB_HOST:-}"
      OOB_HTTP_HOST: "${OOB_HTTP_HOST:-}"
      OOB_HTTP_CALLBACK_HOST: "${OOB_HTTP_CALLBACK_HOST:-}"
      OOB_PUBLIC_IP_SERVICES: "${OOB_PUBLIC_IP_SERVICES:-}"
      OOB_PUBLIC_IP_TIMEOUT: "${OOB_PUBLIC_IP_TIMEOUT:-4}"
      OOB_HTTP_CALLBACK_PORT: "${OOB_HTTP_CALLBACK_PORT:?请在项目根目录 .env 设置 OOB_HTTP_CALLBACK_PORT}"
      OOB_COOKIE_SECURE: "${OOB_COOKIE_SECURE:-1}"
      TRUST_PROXY_HEADERS: "${TRUST_PROXY_HEADERS:-0}"
      OOB_RMI_PORT: "${OOB_RMI_PORT:?请在项目根目录 .env 设置 OOB_RMI_PORT}"
      OOB_LDAP_PORT: "${OOB_LDAP_PORT:?请在项目根目录 .env 设置 OOB_LDAP_PORT}"
      OOB_SESSION_TTL_HOURS: "${OOB_SESSION_TTL_HOURS:-24}"
      OOB_MAX_CONNS: "${OOB_MAX_CONNS:-200}"
      AI_API_URL: "${AI_API_URL:-}"
      AI_API_KEY: "${AI_API_KEY:-}"
      AI_MODEL: "${AI_MODEL:-}"
      AI_TIMEOUT_SECONDS: "${AI_TIMEOUT_SECONDS:-120}"
      AI_MAX_OUTPUT_TOKENS: "${AI_MAX_OUTPUT_TOKENS:-1600}"
      AI_TRUST_ENV_PROXY: "${AI_TRUST_ENV_PROXY:-0}"
      AI_DATA_RETENTION_HOURS: "${AI_DATA_RETENTION_HOURS:-24}"
      AI_DATA_DIR: "/app/runtime/ai"

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - runtime-data:/app/runtime

    mem_limit: 512m
    cpus: 1.5
    pids_limit: 600

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD", "python3", "-c",
             "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/', timeout=5); urllib.request.urlopen('http://127.0.0.1:{}/hc'.format(os.environ['OOB_HTTP_CALLBACK_PORT']), timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  runtime-data:
