{% extends "base.html" %}

{% block content %}
<style>
    .chef-container {
        height: calc(100vh - 100px);
        display: flex;
        gap: 15px;
    }
    
    /* Left Sidebar: Operations */
    .ops-pane {
        width: 260px;
        flex-shrink: 0;
        background: var(--bg-card);
        border: 1px solid var(--border-card);
        border-radius: 8px;
        display: flex;
        flex-direction: column;
    }
    
    .ops-search {
        padding: 10px;
        border-bottom: 1px solid var(--border-line);
    }
    
    .ops-list {
        overflow-y: auto;
        flex-grow: 1;
    }
    
    .op-category {
        padding: 8px 12px;
        background: var(--bg-input);
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
        border-bottom: 1px solid var(--border-line);
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    
    .op-category:hover {
        background: var(--bg-hover);
    }
    
    .op-item {
        padding: 6px 12px 6px 24px;
        cursor: pointer;
        font-size: 13px;
        border-bottom: 1px solid var(--border-line);
        color: var(--text-normal);
    }
    
    .op-item:hover {
        background: var(--bg-hover2);
        color: var(--acc-text);
    }

    /* Middle: Recipe */
    .recipe-pane {
        width: 300px;
        flex-shrink: 0;
        background: var(--bg-card);
        border: 1px solid var(--border-card);
        border-radius: 8px;
        display: flex;
        flex-direction: column;
    }
    
    .recipe-header {
        padding: 10px;
        border-bottom: 1px solid var(--border-line);
        font-weight: bold;
        background: var(--bg-input);
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    
    .recipe-list {
        flex-grow: 1;
        overflow-y: auto;
        padding: 10px;
        background: var(--bg-input);
    }
    
    .recipe-item {
        background: var(--bg-card);
        border: 1px solid var(--border-card);
        border-radius: 8px;
        margin-bottom: 10px;
        box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    
    .recipe-item-header {
        padding: 8px 10px;
        border-bottom: 1px solid var(--border-line);
        display: flex;
        justify-content: space-between;
        align-items: center;
        cursor: move;
        background: var(--bg-card);
    }
    
    .recipe-item-title {
        font-weight: 600;
        font-size: 14px;
    }
    
    .recipe-item-body {
        padding: 10px;
        font-size: 13px;
    }
    
    .recipe-controls i {
        cursor: pointer;
        margin-left: 5px;
        color: var(--text-dim);
    }
    
    .recipe-controls i:hover {
        color: var(--text-strong);
    }
    
    .recipe-controls i.text-danger:hover {
        color: #dc3545;
    }

    /* Right: IO */
    .io-pane {
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        gap: 15px;
        min-width: 0;
    }
    
    .io-box {
        flex-grow: 1;
        background: var(--bg-card);
        border: 1px solid var(--border-card);
        border-radius: 8px;
        display: flex;
        flex-direction: column;
    }
    
    .io-header {
        padding: 8px 12px;
        background: var(--bg-input);
        border-bottom: 1px solid var(--border-line);
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-weight: 600;
        font-size: 13px;
    }
    
    .io-content {
        flex-grow: 1;
        position: relative;
    }
    
    .io-textarea {
        width: 100%;
        height: 100%;
        border: none;
        resize: none;
        padding: 10px;
        font-family: monospace;
        font-size: 13px;
        outline: none;
    }
    
    /* Controls */
    .param-row {
        margin-bottom: 8px;
    }
    .param-label {
        display: block;
        margin-bottom: 2px;
        color: var(--text-dim);
        font-size: 12px;
    }
    .param-input {
        width: 100%;
        padding: 4px 8px;
        font-size: 12px;
        border: 1px solid var(--border-mid);
        background: var(--bg-input);
        color: var(--text-strong);
        border-radius: 8px;
    }
    
    /* Bake Button */
    .bake-btn-container {
        display: flex;
        gap: 10px;
        align-items: center;
    }
    
    .auto-bake-label {
        font-size: 12px;
        user-select: none;
    }

    .detect-panel {
        padding: 8px 10px;
        border-top: 1px solid var(--border-line);
        background: var(--bg-input);
        min-height: 42px;
    }

    .detect-chip {
        border: 1px solid var(--border-btn);
        background: var(--bg-hover);
        color: var(--acc-text);
        border-radius: 999px;
        padding: 3px 9px;
        margin: 2px 4px 2px 0;
        font-size: 12px;
    }

    .detect-chip:hover {
        background: var(--bg-hover2);
    }

    .file-hash-panel {
        padding: 8px 10px;
        border-top: 1px solid var(--border-line);
        background: var(--bg-card);
        font-size: 12px;
    }

    .hash-result {
        display: grid;
        grid-template-columns: 65px minmax(0, 1fr);
        gap: 3px 8px;
        margin-top: 6px;
        font-family: monospace;
        overflow-wrap: anywhere;
    }

    @media (max-width: 1100px) {
        .chef-container { height: auto; flex-wrap: wrap; }
        .ops-pane, .recipe-pane { width: calc(50% - 8px); min-height: 420px; }
        .io-pane { flex-basis: 100%; min-height: 720px; }
    }
</style>

<div class="chef-container">
    <!-- Operations Sidebar -->
    <div class="ops-pane">
        <div class="ops-search">
            <input type="text" class="form-control form-control-sm" id="opSearch" placeholder="搜索操作...">
        </div>
        <div class="ops-list" id="opsList">
            <!-- Categories populated by JS -->
        </div>
    </div>
    
    <!-- Recipe Pane -->
    <div class="recipe-pane">
        <div class="recipe-header">
            <span>处理流程</span>
            <button class="btn btn-sm btn-outline-danger" id="clearRecipeBtn" title="清空流程"><i class="bi bi-trash"></i></button>
        </div>
        <div class="recipe-list" id="recipeList">
            <div class="text-center text-muted mt-5 small">
                点击左侧操作添加到此处
            </div>
        </div>
    </div>
    
    <!-- Input/Output Pane -->
    <div class="io-pane">
        <!-- Input -->
        <div class="io-box">
            <div class="io-header">
                <span>输入</span>
                <div class="bake-btn-container">
                    <div class="form-check form-switch mb-0">
                        <input class="form-check-input" type="checkbox" id="autoBake" checked>
                        <label class="form-check-label auto-bake-label" for="autoBake">自动转换</label>
                    </div>
                    <button class="btn btn-sm btn-primary" id="bakeBtn"><i class="bi bi-play-fill"></i> 转换</button>
                    <button class="btn btn-sm btn-light border" id="clearInputBtn"><i class="bi bi-x-lg"></i></button>
                </div>
            </div>
            <div class="io-content">
                <textarea class="io-textarea" id="inputText" placeholder="在此输入数据..."></textarea>
            </div>
            <div class="detect-panel">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <span class="text-muted"><i class="bi bi-magic"></i> 自动识别与推荐（纯本地）</span>
                    <span class="small text-muted" id="detectSummary">等待输入</span>
                </div>
                <div id="detectResults"><span class="small text-muted">输入内容后自动识别编码、哈希、JWT、JSON、PEM 和时间戳</span></div>
            </div>
            <div class="file-hash-panel">
                <div class="d-flex align-items-center gap-2 flex-wrap">
                    <label class="btn btn-sm btn-outline-secondary mb-0" for="hashFileInput"><i class="bi bi-file-earmark-lock"></i> 本地文件哈希</label>
                    <input class="d-none" type="file" id="hashFileInput">
                    <span class="text-muted" id="hashFileStatus">文件不会上传，按分块读取</span>
                </div>
                <div class="hash-result d-none" id="hashFileResults"></div>
            </div>
        </div>
        
        <!-- Output -->
        <div class="io-box">
            <div class="io-header">
                <span>输出</span>
                <div>
                    <span class="badge bg-light text-dark border me-2" id="outputInfo">Length: 0</span>
                    <button class="btn btn-sm btn-light border" id="copyOutputBtn" title="复制结果"><i class="bi bi-clipboard"></i></button>
                </div>
            </div>
            <div class="io-content">
                <textarea class="io-textarea" id="outputText" readonly placeholder="结果将显示在此处..."></textarea>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block scripts %}
<!-- Vendor Libs -->
<script src="{{ url_for('static', filename='js/vendor/crypto-js.min.js') }}"></script>
<script src="{{ url_for('static', filename='js/vendor/jsencrypt.min.js') }}"></script>
<!-- Vendored sm-crypto 0.3.13 browser builds. No CDN requests are made. -->
<script src="{{ url_for('static', filename='js/vendor/sm2.min.js') }}"></script>
<script src="{{ url_for('static', filename='js/vendor/sm3.min.js') }}"></script>
<script src="{{ url_for('static', filename='js/vendor/sm4.min.js') }}"></script>
<script src="{{ url_for('static', filename='js/cyberchef_helpers.js') }}"></script>
<!-- Controller -->
<script src="{{ url_for('static', filename='js/cyberchef.js') }}"></script>
{% endblock %}
